name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature or improvement for SecOps Orchestrator!
  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve or what limitation did you encounter?
      placeholder: Describe the problem or use case...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What should be changed or added to address this?
      placeholder: Describe the desired behavior or API design...
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions, workflows, or workarounds?
      placeholder: Describe alternatives considered...
  - type: textarea
    id: expected-user-value
    attributes:
      label: Expected user value
      description: Who benefits from this feature and how does it improve the developer/security experience?
      placeholder: Describe the expected impact...
  - type: textarea
    id: security-compatibility
    attributes:
      label: Security / compatibility considerations
      description: Does this introduce security risks, breaking changes, or new operational dependencies?
      placeholder: Detail security, privacy, or compatibility impacts...
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any diagrams, references, mockups, or related tools.
  - type: checkboxes
    id: pre-flight-check
    attributes:
      label: Pre-flight Check
      options:
        - label: I have checked existing issues for similar requests.
          required: true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-orchestrator"
version = "0.1.0"
description = "Automated DevSecOps security orchestration platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "C4",
    "PT",
    "SIM",
]
ignore = [
    "S101",
    "S104",
    "S105",
    "S108",
    "S603",
    "S607",
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"alembic/**" = ["I", "UP", "F401", "F403"]

[tool.setuptools.packages.find]
where = ["."]

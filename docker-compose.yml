services:
  postgres:
    image: postgres:16-alpine
    container_name: secops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secops}
      POSTGRES_DB: ${POSTGRES_DB:-secops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secops} -d ${POSTGRES_DB:-secops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zap:
    image: zaproxy/zap-stable:2.15.0
    container_name: secops-zap
    user: "1000:1000"
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
      -config autoupdate.checkOnStart=false
      -config autoupdate.checkAddonUpdates=false
      -config autoupdate.installAddonUpdates=false
      -config autoupdate.installScannerRules=false
      -config autoupdate.downloadNewRelease=false
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "zap-cli status || curl -s http://localhost:8080/JSON/core/view/version/ || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: secops-api
    environment:
      SECOPS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops}@postgres:5432/${POSTGRES_DB:-secops}
      SECOPS_DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops}@postgres:5432/${POSTGRES_DB:-secops}
      SECOPS_REDIS_URL: redis://redis:6379/0
      SECOPS_WORKSPACE_BASE: /tmp/secops-workspaces
      SECOPS_ALLOWED_WORKSPACE_ROOT: /tmp/secops-workspaces
      SECOPS_DAST_ALLOWED_HOSTS: ${SECOPS_DAST_ALLOWED_HOSTS:-localhost,127.0.0.1,api,staging-app,app,web,testserver,test-app,*.internal,*.local,*.test}
      SECOPS_DAST_ENFORCE_HOST_ALLOWLIST: ${SECOPS_DAST_ENFORCE_HOST_ALLOWLIST:-true}
      AI_APPSEC_ENABLED: ${AI_APPSEC_ENABLED:-false}
      AI_APPSEC_BASE_URL: ${AI_APPSEC_BASE_URL:-}
      AI_APPSEC_API_KEY: ${AI_APPSEC_API_KEY:-}
      AI_APPSEC_MODEL: ${AI_APPSEC_MODEL:-gpt-4o}
    ports:
      - "${SECOPS_API_PORT:-8008}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspaces_data:/tmp/secops-workspaces

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: secops-worker
    environment:
      SECOPS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops}@postgres:5432/${POSTGRES_DB:-secops}
      SECOPS_DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops}@postgres:5432/${POSTGRES_DB:-secops}
      SECOPS_REDIS_URL: redis://redis:6379/0
      SECOPS_WORKSPACE_BASE: /tmp/secops-workspaces
      SECOPS_WORKER_MAX_JOBS: ${SECOPS_WORKER_MAX_JOBS:-1}
      SECOPS_CODEQL_THREADS: ${SECOPS_CODEQL_THREADS:-0}
      SECOPS_ALLOWED_WORKSPACE_ROOT: /tmp/secops-workspaces
      SECOPS_DAST_ALLOWED_HOSTS: ${SECOPS_DAST_ALLOWED_HOSTS:-localhost,127.0.0.1,api,staging-app,app,web,testserver,test-app,*.internal,*.local,*.test}
      SECOPS_DAST_ENFORCE_HOST_ALLOWLIST: ${SECOPS_DAST_ENFORCE_HOST_ALLOWLIST:-true}
      SECOPS_ZAP_PATH: ${SECOPS_ZAP_PATH:-zap-baseline.py}
      SECOPS_ZAP_URL: ${SECOPS_ZAP_URL:-http://zap:8080}
      SECOPS_NUCLEI_PATH: ${SECOPS_NUCLEI_PATH:-nuclei}
      AI_APPSEC_ENABLED: ${AI_APPSEC_ENABLED:-false}
      AI_APPSEC_BASE_URL: ${AI_APPSEC_BASE_URL:-}
      AI_APPSEC_API_KEY: ${AI_APPSEC_API_KEY:-}
      AI_APPSEC_MODEL: ${AI_APPSEC_MODEL:-gpt-4o}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspaces_data:/tmp/secops-workspaces
      - trivy_cache:/home/secops/.cache/trivy

volumes:
  postgres_data:
  redis_data:
  workspaces_data:
  trivy_cache:
